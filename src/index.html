<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ACDL Live Editor</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css" />

  <!-- Export libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* Layout overrides for the app shell */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-primary);
    }

    /* Top header bar */
    header {
      height: 60px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-divider {
      color: var(--text-muted);
      font-weight: 300;
    }

    #drop-zone {
      flex: 1;
      max-width: 400px;
      height: 50px;
      border: 1px dashed var(--border-medium);
      border-radius: 8px;
      padding: 8px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 2px;
    }

    #drop-zone:hover,
    #drop-zone.hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--system-border);
    }

    .drop-text {
      font-weight: 600;
    }

    .browse-btn {
      font-size: 12px;
      color: var(--system-border);
      font-weight: 400;
    }

    .prompt-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prompt-selector label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .prompt-selector select {
      padding: 6px 10px;
      border: 1px solid var(--border-medium);
      border-radius: 6px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
    }

    /* Main content area */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar editor panel */
    #sidebar {
      width: 420px;
      min-width: 200px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 12px;
      box-sizing: border-box;
      transition: width 0.3s ease, min-width 0.3s ease, padding 0.3s ease;
    }

    #sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .panel-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 12px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .panel-toggle-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border-color: var(--border-medium);
    }

    #acdl-editor-container {
      flex: 1;
      width: 100%;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #acdl-editor-container:focus-within {
      border-color: var(--system-border);
      box-shadow: 0 0 0 3px var(--system-glow);
    }

    #acdl-editor-container .cm-editor {
      height: 100%;
    }

    #acdl-editor-container .cm-scroller {
      overflow: auto;
    }

    #render-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(16, 185, 129, 0.25);
    }

    #render-btn:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 12px rgba(16, 185, 129, 0.35);
    }

    /* Resizer between panels */
    .resizer {
      width: 6px;
      background: var(--border-subtle);
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.2s ease;
      position: relative;
    }

    .resizer:hover,
    .resizer.dragging {
      background: var(--system-border);
    }

    .resizer::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 30px;
      background: var(--text-muted);
      border-radius: 1px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .resizer:hover::after,
    .resizer.dragging::after {
      opacity: 1;
    }

    /* Output visualization panel */
    #output-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 200px;
      overflow: hidden;
      transition: min-width 0.3s ease;
    }

    #output-wrapper.collapsed {
      min-width: 0 !important;
      flex: 0 !important;
      width: 0 !important;
      overflow: hidden;
    }

    #output-wrapper.collapsed #output-header,
    #output-wrapper.collapsed #output {
      display: none;
    }

    #output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }

    #output-header h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      background: var(--bg-primary);
    }

    /* Collapsed panel restore buttons */
    .restore-btn {
      position: fixed;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      font-size: 12px;
      transition: all 0.2s ease;
      display: none;
      z-index: 100;
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .restore-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border-color: var(--system-border);
    }

    #restore-sidebar {
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      border-left: none;
      border-radius: 0 4px 4px 0;
    }

    #restore-output {
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      border-right: none;
      border-radius: 4px 0 0 4px;
    }

    #sidebar.collapsed ~ .resizer ~ #output-wrapper #restore-sidebar,
    .main-container:has(#sidebar.collapsed) #restore-sidebar {
      display: block;
    }

    body:has(#sidebar.collapsed) #restore-sidebar {
      display: block;
    }

    body:has(#output-wrapper.collapsed) #restore-output {
      display: block;
    }

    /* Info message styling */
    .info-msg {
      color: var(--text-secondary);
      text-align: center;
      padding: 60px 40px;
      font-size: 15px;
    }

    /* Prevent text selection while dragging */
    body.resizing {
      user-select: none;
      cursor: col-resize;
    }

    /* Export button and dropdown */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .export-dropdown {
      position: relative;
    }

    .export-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .export-btn:hover {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transform: translateY(-1px);
    }

    .export-btn:disabled {
      background: var(--bg-tertiary);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .export-btn svg {
      width: 14px;
      height: 14px;
    }

    .export-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 4px;
      min-width: 140px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      display: none;
    }

    .export-menu.show {
      display: block;
    }

    .export-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .export-menu-item:hover {
      background: var(--bg-tertiary);
    }

    .export-menu-item svg {
      width: 16px;
      height: 16px;
      color: var(--text-secondary);
    }

    /* Export loading state */
    .export-btn.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .export-btn.loading::after {
      content: '';
      width: 12px;
      height: 12px;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 4px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Width control slider */
    .width-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 12px;
      padding-right: 12px;
      border-right: 1px solid var(--border-subtle);
    }

    .width-control label {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .width-control input[type="range"] {
      width: 180px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border-medium);
      border-radius: 2px;
      cursor: pointer;
    }

    .width-btn {
      width: 24px;
      height: 24px;
      border: 1px solid var(--border-medium);
      border-radius: 4px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      line-height: 1;
    }

    .width-btn:hover {
      background: var(--bg-tertiary);
      border-color: var(--system-border);
    }

    .width-btn:active {
      transform: scale(0.95);
    }

    .width-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: var(--system-border);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .width-control input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .width-control input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: var(--system-border);
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    .width-control input[type="number"] {
      width: 55px;
      padding: 4px 6px;
      border: 1px solid var(--border-medium);
      border-radius: 4px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 12px;
      text-align: center;
      -moz-appearance: textfield;
    }

    .width-control input[type="number"]::-webkit-outer-spin-button,
    .width-control input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .width-control .width-unit {
      font-size: 12px;
      color: var(--text-muted);
    }

  </style>
</head>

<body>
  <header>
    <h1>ACDL<span class="header-divider">|</span>Live Editor</h1>
    <label id="drop-zone" for="acdl-upload">
      <span class="drop-text">Drop .acdl file here</span>
      <span class="browse-btn">or browse</span>
      <input type="file" id="acdl-upload" accept=".acdl" style="display: none;" />
    </label>
    <div class="prompt-selector">
      <label for="prompt-select">Examples:</label>
      <select id="prompt-select">
        <option value="">-- Select --</option>
        <optgroup label="Basic Patterns">
          <option value="basic">Basic Context</option>
          <option value="rag">Basic RAG</option>
        </optgroup>
        <optgroup label="ReAct Patterns">
          <option value="react">ReAct</option>
          <option value="fig1_left">ReAct No Reasoning in History</option>
          <option value="fig1_right">ReAct with Tool-RAG</option>
        </optgroup>
        <optgroup label="Real-World Systems">
          <option value="opencode">OpenCode</option>
          <option value="openclaw">OpenClaw</option>
          <option value="pokemon">Pokemon Agent</option>
          <option value="multiagent">Multi-Agent Simulation</option>
          <option value="mintagent">MintAgent</option>
        </optgroup>
      </select>
    </div>
  </header>

  <div class="main-container">
    <aside id="sidebar">
      <div class="panel-header">
        <h3>Source Editor</h3>
        <button class="panel-toggle-btn" id="collapse-sidebar" title="Collapse editor">
          <span>&#x25C0;</span>
        </button>
      </div>
      <div id="acdl-editor-container"></div>
      <button id="render-btn">Render Visualization</button>
    </aside>

    <div class="resizer" id="resizer"></div>

    <div id="output-wrapper">
      <div id="output-header">
        <h3>Visualization</h3>
        <div class="header-actions">
          <div class="width-control">
            <label for="width-slider">Width:</label>
            <button class="width-btn" id="width-decrease" title="Decrease width">−</button>
            <input type="range" id="width-slider" min="200" max="1000" value="800" />
            <button class="width-btn" id="width-increase" title="Increase width">+</button>
            <input type="number" id="width-input" min="200" max="1000" value="800" />
            <span class="width-unit">px</span>
          </div>
          <div class="export-dropdown">
            <button class="export-btn" id="export-btn" title="Export visualization">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Export
            </button>
            <div class="export-menu" id="export-menu">
              <button class="export-menu-item" id="export-png">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                Export as PNG
              </button>
              <button class="export-menu-item" id="export-pdf">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="16" y1="13" x2="8" y2="13"/>
                  <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                Export as PDF
              </button>
            </div>
          </div>
          <button class="panel-toggle-btn" id="collapse-output" title="Collapse visualization">
            <span>&#x25B6;</span>
          </button>
        </div>
      </div>
      <main id="output" class="compact">
        <div class="info-msg">
          Select an example prompt from the dropdown or enter ACDL code, then click "Render Visualization"
        </div>
      </main>
    </div>
  </div>

  <!-- Restore buttons for collapsed panels -->
  <button class="restore-btn" id="restore-sidebar" title="Show editor">Editor</button>
  <button class="restore-btn" id="restore-output" title="Show visualization">Viz</button>

  <script type="module">
    import {
      initFileHandlers, getEditorView, doRender, installBlockStyles,
      getRenderedBlocks, getWrapWidth, setWrapWidth, renderBlockSvg, svgSize,
    } from "./main-ui.ts";
    // Contract with the non-module export / width script below.
    window.ACDLGetEditorView = getEditorView;
    window.ACDLGetRenderedBlocks = getRenderedBlocks;
    window.ACDLGetWrapWidth = getWrapWidth;
    window.ACDLSetWrapWidth = setWrapWidth;
    window.ACDLRenderBlockSvg = renderBlockSvg;
    window.ACDLSvgSize = svgSize;

    // Load JetBrains Mono as base64 for the SVG renderer (svg-layout.ts).
    // The standalone/website build injects window.__ACDL_FONTS__ at build time; the
    // dev server fetches the .ttf files so the SVG layout uses real glyph metrics
    // and the exports embed the font, matching the website and the extension.
    const fontsReady = (async function loadAcdlFonts() {
      if (window.__ACDL_FONTS__) return;
      try {
        const toBase64 = (buf) => {
          let binary = "";
          const bytes = new Uint8Array(buf);
          for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          return btoa(binary);
        };
        const [regular, bold] = await Promise.all([
          fetch("/fonts/JetBrainsMono-Regular.ttf").then((r) => r.arrayBuffer()),
          fetch("/fonts/JetBrainsMono-Bold.ttf").then((r) => r.arrayBuffer()),
        ]);
        window.__ACDL_FONTS__ = { regular: toBase64(regular), bold: toBase64(bold) };
      } catch (e) {
        // Rendering falls back to estimated metrics if fonts can't be fetched
      }
    })();

    // Map dropdown values to file paths (absolute paths resolved by Vite alias)
    const PROMPT_PATHS = {
      react1: '/ACDL_examples/React_variants/react1.acdl',
      react2: '/ACDL_examples/React_variants/react2.acdl',
      react: '/website/src/examples/react.acdl',
      react_tutorial: '/website/src/examples/react.acdl',
      fig1_base: '/website/src/examples/react.acdl',
      fig1_left: '/ACDL_examples/React_variants/fig1-left.acdl',
      fig1_right: '/ACDL_examples/React_variants/fig1-right.acdl',
      rag: '/ACDL_examples/other/basic-rag.acdl',
      mintagent: '/ACDL_examples/MintAgent_variants/mint-original.acdl',
      multiagent: '/ACDL_examples/complex_examples/MultiAgent.acdl',
      openclaw: '/ACDL_examples/complex_examples/OpenClaw.acdl',
      opencode: '/ACDL_examples/complex_examples/OpenCode.acdl',
      pokemon: '/ACDL_examples/complex_examples/pokemon.acdl',
    };

    async function loadExample(key) {
      const response = await fetch(PROMPT_PATHS[key]);
      if (!response.ok) throw new Error(`Failed to load ${key}`);
      const text = await response.text();
      await fontsReady;
      const editorView = getEditorView();
      if (editorView) {
        editorView.dispatch({
          changes: { from: 0, to: editorView.state.doc.length, insert: text }
        });
        doRender();
      }
    }

    // Load example from URL parameter
    async function loadExampleFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const example = params.get('example');
      if (example && PROMPT_PATHS[example]) {
        try {
          await loadExample(example);
        } catch (err) {
          console.error("Failed to load example from URL:", err);
        }
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      try {
        initFileHandlers();
        // Once the fonts arrive, swap the page @font-face to the same data
        // the renderer measured with (initFileHandlers may have installed the
        // /fonts fallback first).
        fontsReady.then(() => {
          const old = document.getElementById("acdl-block-styles");
          if (old && window.__ACDL_FONTS__) {
            old.remove();
            installBlockStyles();
          }
        });

        // Check for example in URL parameter
        loadExampleFromUrl();

        // Set up examples dropdown
        const promptSelect = document.getElementById("prompt-select");
        promptSelect.addEventListener("change", async () => {
          const key = promptSelect.value;
          if (key && PROMPT_PATHS[key]) {
            try {
              await loadExample(key);
            } catch (err) {
              console.error("Failed to load example:", err);
              alert("Failed to load example. Please try again.");
            }
          }
        });
      } catch (err) {
        document.getElementById("output").innerHTML =
          `<pre style="color:red;padding:20px">${err.stack || err.message}</pre>`;
      }
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sidebar = document.getElementById("sidebar");
      const resizer = document.getElementById("resizer");
      const outputWrapper = document.getElementById("output-wrapper");
      const output = document.getElementById("output");
      const collapseSidebar = document.getElementById("collapse-sidebar");
      const collapseOutput = document.getElementById("collapse-output");
      const restoreSidebar = document.getElementById("restore-sidebar");
      const restoreOutput = document.getElementById("restore-output");

      let isResizing = false;
      let lastSidebarWidth = 420;

      // Resizer drag functionality
      resizer.addEventListener("mousedown", (e) => {
        isResizing = true;
        document.body.classList.add("resizing");
        resizer.classList.add("dragging");
        e.preventDefault();
      });

      document.addEventListener("mousemove", (e) => {
        if (!isResizing) return;

        const containerRect = document.querySelector(".main-container").getBoundingClientRect();
        const newSidebarWidth = e.clientX - containerRect.left;
        const minWidth = 200;
        const maxWidth = containerRect.width - 250; // Leave space for output

        if (newSidebarWidth >= minWidth && newSidebarWidth <= maxWidth) {
          sidebar.style.width = newSidebarWidth + "px";
          lastSidebarWidth = newSidebarWidth;
        }
      });

      document.addEventListener("mouseup", () => {
        if (isResizing) {
          isResizing = false;
          document.body.classList.remove("resizing");
          resizer.classList.remove("dragging");
        }
      });

      // Collapse/expand sidebar
      collapseSidebar.addEventListener("click", () => {
        sidebar.classList.add("collapsed");
        restoreSidebar.style.display = "block";
      });

      restoreSidebar.addEventListener("click", () => {
        sidebar.classList.remove("collapsed");
        sidebar.style.width = lastSidebarWidth + "px";
        restoreSidebar.style.display = "none";
      });

      // Collapse/expand output
      collapseOutput.addEventListener("click", () => {
        outputWrapper.classList.add("collapsed");
        restoreOutput.style.display = "block";
      });

      restoreOutput.addEventListener("click", () => {
        outputWrapper.classList.remove("collapsed");
        restoreOutput.style.display = "none";
      });

      // ---- Wrap width ------------------------------------------------------
      // The wrap width (200–1000 px, default 800) is what the SVG renderer
      // wraps content at, so changing it re-renders every block, exactly like
      // the VSCode extension's preview. The slider shows the pending value
      // while dragging and commits (re-renders) on release.
      const widthSlider = document.getElementById("width-slider");
      const widthInput = document.getElementById("width-input");
      const MIN_WIDTH = 200, MAX_WIDTH = 1000, STEP = 10;

      function clampWidth(value) {
        const w = parseInt(value, 10);
        if (isNaN(w)) return window.ACDLGetWrapWidth();
        return Math.min(MAX_WIDTH, Math.max(MIN_WIDTH, w));
      }
      function showWidth(value) {
        widthSlider.value = value;
        widthInput.value = value;
      }
      function commitWidth(value) {
        const w = clampWidth(value);
        showWidth(w);
        window.ACDLSetWrapWidth(w);
      }

      showWidth(window.ACDLGetWrapWidth());
      widthSlider.addEventListener("input", (e) => { widthInput.value = e.target.value; });
      widthSlider.addEventListener("change", (e) => commitWidth(e.target.value));
      widthInput.addEventListener("change", (e) => commitWidth(e.target.value));
      widthInput.addEventListener("keyup", (e) => {
        if (e.key === "Enter") commitWidth(e.target.value);
      });

      // +/- buttons for width adjustment
      const widthDecrease = document.getElementById("width-decrease");
      const widthIncrease = document.getElementById("width-increase");
      widthDecrease.addEventListener("click", () => commitWidth(window.ACDLGetWrapWidth() - STEP));
      widthIncrease.addEventListener("click", () => commitWidth(window.ACDLGetWrapWidth() + STEP));

      // ---- Export ----------------------------------------------------------
      // Every export goes through the SVG renderer at the wrap width, the same
      // pipeline that draws the page (and the VSCode extension's preview), so
      // PNG and PDF look exactly like what is on screen.
      const exportBtn = document.getElementById("export-btn");
      const exportMenu = document.getElementById("export-menu");
      const exportPng = document.getElementById("export-png");
      const exportPdf = document.getElementById("export-pdf");

      // Toggle export menu
      exportBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        exportMenu.classList.toggle("show");
      });

      // Close menu when clicking outside
      document.addEventListener("click", () => {
        exportMenu.classList.remove("show");
      });

      // Gap between stacked blocks (CSS px in a PNG, pt in a continuous PDF page).
      const BLOCK_GAP = 24;

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Could not load rendered SVG"));
          img.src = src;
        });
      }

      // Render each block to a self-contained SVG (fonts embedded) and draw it
      // onto a canvas at `scale` device pixels per CSS pixel.
      async function rasterizeBlocks(blocks, scale) {
        const wrapWidth = window.ACDLGetWrapWidth();
        const items = [];
        for (let i = 0; i < blocks.length; i++) {
          const svg = window.ACDLRenderBlockSvg(blocks[i], wrapWidth);
          const { width: w, height: h } = window.ACDLSvgSize(svg);
          const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          try {
            const img = await loadImage(url);
            // Cap so very tall blocks stay within canvas limits.
            const s = Math.max(1, Math.min(scale || 4, 16000 / Math.max(w, h)));
            const canvas = document.createElement("canvas");
            canvas.width = Math.ceil(w * s);
            canvas.height = Math.ceil(h * s);
            const ctx = canvas.getContext("2d");
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            items.push({ index: i, canvas, width: w, height: h });
          } finally {
            URL.revokeObjectURL(url);
          }
        }
        return items;
      }

      // Stack several rasters into one tall image.
      function stitchItems(items) {
        const first = items[0].canvas;
        const scale = first.width / items[0].width;
        const gap = Math.round(BLOCK_GAP * scale);
        const w = Math.max(...items.map((it) => it.canvas.width));
        const h = items.reduce((sum, it) => sum + it.canvas.height, 0) + gap * (items.length - 1);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);
        let y = 0;
        for (const it of items) {
          ctx.drawImage(it.canvas, 0, y);
          y += it.canvas.height + gap;
        }
        return canvas;
      }

      function blocksToExport() {
        const blocks = window.ACDLGetRenderedBlocks ? window.ACDLGetRenderedBlocks() : [];
        if (!blocks || blocks.length === 0) {
          alert("No visualization to export. Please render a prompt first.");
          return null;
        }
        return blocks;
      }

      // Export as PNG: every block, stacked into one image (scale 2, like the
      // extension's PNG export).
      exportPng.addEventListener("click", async () => {
        exportMenu.classList.remove("show");
        const blocks = blocksToExport();
        if (!blocks) return;

        exportBtn.classList.add("loading");
        try {
          const items = await rasterizeBlocks(blocks, 2);
          const canvas = items.length > 1 ? stitchItems(items) : items[0].canvas;
          const link = document.createElement("a");
          link.download = "acdl-visualization.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        } catch (error) {
          console.error("Export failed:", error);
          alert("Failed to export PNG: " + error.message);
        } finally {
          exportBtn.classList.remove("loading");
        }
      });

      // Export as PDF: one page per block. Pages are max(A4 width, widest
      // block) wide, with one scale factor for the whole document so blocks
      // keep their relative sizes (the extension's PDF export does the same).
      exportPdf.addEventListener("click", async () => {
        exportMenu.classList.remove("show");
        const blocks = blocksToExport();
        if (!blocks) return;

        exportBtn.classList.add("loading");
        try {
          const items = await rasterizeBlocks(blocks, 4);
          const MM_PER_PX = 0.264583; // px to mm at 96dpi
          const maxWmm = Math.max(...items.map((it) => it.width * MM_PER_PX));
          const pageW = Math.max(210, maxWmm);
          const scale = pageW / maxWmm;

          const { jsPDF } = window.jspdf;
          let pdf = null;
          for (const it of items) {
            const w = it.width * MM_PER_PX * scale;
            const h = it.height * MM_PER_PX * scale;
            const format = [pageW, h];
            const orientation = pageW > h ? "landscape" : "portrait";
            if (!pdf) {
              pdf = new jsPDF({ orientation, unit: "mm", format });
            } else {
              pdf.addPage(format, orientation);
            }
            pdf.addImage(it.canvas.toDataURL("image/png"), "PNG", 0, 0, w, h);
          }
          pdf.save("acdl-visualization.pdf");
        } catch (error) {
          console.error("Export failed:", error);
          alert("Failed to export PDF: " + error.message);
        } finally {
          exportBtn.classList.remove("loading");
        }
      });
    });
  </script>
</body>
</html>
