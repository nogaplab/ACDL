<!DOCTYPE html>
<html lang="en">
<head>
  {{GA}}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{BASE}}shared/styles.css">
  <style>
    .hero {
      padding: 120px 24px 40px;
    }

    /* The URL box */
    .extract-section {
      background: #fff;
      padding: 8px 24px 64px;
    }

    .extract-container {
      max-width: 860px;
      margin: 0 auto;
    }

    .url-form {
      background: linear-gradient(135deg, #fafaff 0%, #f5f5fa 100%);
      border: 1px solid rgba(120, 119, 198, 0.16);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 4px 24px rgba(120, 119, 198, 0.08);
    }

    .url-form label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(10, 10, 10, 0.45);
      margin-bottom: 10px;
    }

    .url-row {
      display: flex;
      gap: 12px;
    }

    .url-row input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.92rem;
      color: #0a0a0a;
      background: #fff;
      border: 1px solid rgba(120, 119, 198, 0.25);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .url-row input:focus {
      border-color: #7877c6;
      box-shadow: 0 0 0 3px rgba(120, 119, 198, 0.15);
    }

    .url-row .btn {
      flex-shrink: 0;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .url-hint {
      margin: 12px 0 0;
      font-size: 0.85rem;
      color: rgba(10, 10, 10, 0.5);
    }

    .url-error {
      margin: 12px 0 0;
      font-size: 0.85rem;
      color: #c0392b;
      font-weight: 500;
    }

    .examples-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding-left: 4px;
      font-size: 0.85rem;
      color: rgba(10, 10, 10, 0.45);
    }

    .example-chip {
      background: rgba(120, 119, 198, 0.08);
      border: 1px solid rgba(120, 119, 198, 0.18);
      border-radius: 999px;
      padding: 5px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: #5d5cb8;
      cursor: pointer;
      transition: background 0.15s;
    }

    .example-chip:hover {
      background: rgba(120, 119, 198, 0.16);
    }

    /* The generated result */
    .result {
      margin-top: 28px;
      border: 1px solid rgba(120, 119, 198, 0.18);
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 32px rgba(120, 119, 198, 0.1);
    }

    .result-head {
      padding: 20px 24px 0;
      border-bottom: 1px solid rgba(120, 119, 198, 0.12);
    }

    .result-target {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 16px;
    }

    .result-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(10, 10, 10, 0.4);
    }

    .result-repo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 500;
      color: #0a0a0a;
      word-break: break-all;
    }

    .tabs {
      display: flex;
      gap: 4px;
    }

    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      color: rgba(10, 10, 10, 0.5);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab:hover {
      color: #0a0a0a;
    }

    .tab.is-active {
      color: #5d5cb8;
      border-bottom-color: #7877c6;
    }

    .tab-panel {
      display: none;
      padding: 22px 24px 24px;
    }

    .tab-panel.is-active {
      display: block;
    }

    .panel-note {
      margin: 0 0 16px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: rgba(10, 10, 10, 0.6);
    }

    .code-block {
      position: relative;
      background: linear-gradient(135deg, #1e1e2e, #2a2a3e);
      border: 1px solid rgba(120, 119, 198, 0.2);
      border-radius: 12px;
      overflow: hidden;
    }

    .code-block pre {
      margin: 0;
      padding: 18px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      color: #e0e0e0;
      overflow-x: auto;
      white-space: pre;
      tab-size: 2;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 5px 12px;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    .copy-btn.copied {
      background: rgba(120, 119, 198, 0.5);
      color: #fff;
    }

    .gha-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .gha-actions a,
    .gha-actions button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(120, 119, 198, 0.09);
      border: 1px solid rgba(120, 119, 198, 0.22);
      border-radius: 10px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: #5d5cb8;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .gha-actions a:hover,
    .gha-actions button:hover {
      background: rgba(120, 119, 198, 0.18);
    }

    .gha-actions svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .gha-fallback {
      margin: 0 0 16px;
      font-size: 0.85rem;
      color: rgba(10, 10, 10, 0.55);
    }

    .gha-hosted {
      margin: 16px 0 0;
      font-size: 0.82rem;
      line-height: 1.6;
      color: rgba(10, 10, 10, 0.5);
    }

    .gha-hosted a {
      color: #5d5cb8;
      font-weight: 500;
    }

    .result-foot {
      background: linear-gradient(135deg, #fafaff 0%, #f5f5fa 100%);
      border-top: 1px solid rgba(120, 119, 198, 0.12);
      padding: 20px 24px;
      display: grid;
      gap: 12px;
    }

    .deliverable {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
      font-size: 0.85rem;
      color: rgba(10, 10, 10, 0.55);
      line-height: 1.5;
    }

    .deliverable-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      color: #5d5cb8;
      background: rgba(120, 119, 198, 0.1);
      border-radius: 6px;
      padding: 3px 9px;
      flex-shrink: 0;
    }

    /* Supporting sections */
    .how-section {
      background: #0a0a0a;
      padding: 72px 24px;
    }

    .how-section .section-header h2 {
      color: #fff;
    }

    .how-section .section-header p {
      color: rgba(255, 255, 255, 0.5);
    }

    .how-section .features-grid {
      gap: 16px;
    }

    .how-section .feature-card {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 24px;
      transition: background 0.2s, transform 0.2s;
    }

    .how-section .feature-card:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .how-section .feature-card svg {
      width: 26px;
      height: 26px;
      color: #a5a4e3;
      margin-bottom: 12px;
    }

    .how-section .feature-card h3 {
      color: #fff;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .how-section .feature-card p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .how-section .code-inline {
      background: rgba(255, 255, 255, 0.12);
      color: #cfcef0;
    }

    .next-section {
      background: #fff;
      padding: 64px 24px;
    }

    .next-section .section-header h2 {
      color: #0a0a0a;
    }

    .next-section .section-header p {
      color: rgba(10, 10, 10, 0.5);
    }

    .next-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .next-card {
      display: block;
      background: linear-gradient(135deg, #fafaff 0%, #f5f5fa 100%);
      border: 1px solid rgba(120, 119, 198, 0.14);
      border-radius: 16px;
      padding: 24px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .next-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(120, 119, 198, 0.12);
    }

    .next-card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0a0a0a;
      margin: 0 0 8px;
    }

    .next-card p {
      font-size: 0.88rem;
      line-height: 1.55;
      color: rgba(10, 10, 10, 0.55);
      margin: 0;
    }

    @media (max-width: 900px) {
      .next-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .url-row {
        flex-direction: column;
      }

      .tabs {
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  {{NAV}}

  {{CONTENT}}

  {{FOOTER}}

  <!-- The workflow handed to visitors for their own repo. It lives in a
       template element rather than a JS string so the ${{ }} expressions that
       GitHub Actions needs survive verbatim. __TARGET__ is filled in from the
       URL box. -->
  <script id="ghaTemplate" type="text/template"># Extract the ACDL specification of this agent's context-creation process.
# Source: __TARGET__
#
# Setup, once: Settings -> Secrets and variables -> Actions -> New repository
# secret, named ANTHROPIC_API_KEY.
#
# Then: Actions -> ACDL extract -> Run workflow. The spec and the evidence
# report come back as the "acdl-spec" artifact on the run.
name: ACDL extract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Check out the ACDL toolchain
        uses: actions/checkout@v4
        with:
          repository: nogaplab/ACDL
          path: acdl

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install anthropic

      # Read-only over repo/, with the deliverables in out/ — outside the
      # analyzed tree, so the run never reads its own output back as evidence.
      - name: Extract the ACDL specification
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python acdl/acdl-agent/acdl-agent.py \
            --target repo \
            -o out \
            --model claude-opus-5 \
            --effort high

      - name: Upload the specification and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acdl-spec
          path: out/
          if-no-files-found: warn
</script>

  <script>
    (function () {
      'use strict';

      var ACDL_CLONE = 'https://github.com/nogaplab/ACDL.git';
      var WORKFLOW_PATH = '.github/workflows/acdl-extract.yml';

      var form = document.getElementById('urlForm');
      var input = document.getElementById('repoUrl');
      var errorEl = document.getElementById('urlError');
      var result = document.getElementById('result');

      // Accepts the three forms people actually paste: an https:// URL copied
      // from the browser (possibly deep inside a tree/blob view), the SSH
      // remote, or a bare owner/name.
      function parseRepo(raw) {
        var s = (raw || '').trim().replace(/\/+$/, '');
        if (!s) return null;

        var host, path, ssh = false, m;

        if ((m = s.match(/^(?:ssh:\/\/)?git@([^:\/]+)[:\/](.+)$/))) {
          host = m[1];
          path = m[2];
          ssh = true;
        } else if ((m = s.match(/^https?:\/\/(?:[^@\/]+@)?([^\/]+)\/(.+)$/))) {
          host = m[1];
          path = m[2];
        } else if (/^[\w.-]+\/[\w.-]+$/.test(s)) {
          host = 'github.com';
          path = s;
        } else {
          return null;
        }

        path = path.replace(/\.git$/, '');

        // Strip the web-UI suffixes (/tree/main/src, GitLab's /-/blob/...) and
        // keep the ref they name.
        var ref = '';
        var deep = path.match(/^(.+?)\/(?:-\/)?(?:tree|blob|commit|commits|src)\/([^\/]+)/);
        if (deep) {
          path = deep[1];
          ref = deep[2];
        }

        var parts = path.split('/').filter(Boolean);
        if (parts.length < 2) return null;

        var name = parts[parts.length - 1];
        var owner = parts.slice(0, -1).join('/');
        if (!/^[\w.-]+$/.test(name)) return null;

        return {
          host: host,
          owner: owner,
          name: name,
          ref: ref,
          slug: owner + '/' + name,
          isGitHub: /(^|\.)github\.com$/i.test(host),
          cloneUrl: ssh
            ? 'git@' + host + ':' + owner + '/' + name + '.git'
            : 'https://' + host + '/' + owner + '/' + name + '.git'
        };
      }

      function cloneLines(repo) {
        var branch = repo.ref ? ' --branch ' + repo.ref : '';
        return [
          '# 1. the repository to analyze',
          'git clone --depth 1' + branch + ' ' + repo.cloneUrl + ' ' + repo.name,
          '',
          '# 2. the ACDL toolchain, alongside it',
          'git clone --depth 1 ' + ACDL_CLONE + ' acdl',
          ''
        ];
      }

      function claudeCodeScript(repo) {
        return cloneLines(repo).concat([
          '# 3. extract - reads ' + repo.name + '/, writes out/' + repo.name + '/',
          'acdl/acdl-agent/acdl-extract.sh --target ' + repo.name + ' -o out/' + repo.name,
          '',
          '# --dry-run prints the assembled prompt without spending anything'
        ]).join('\n');
      }

      function apiScript(repo) {
        return cloneLines(repo).concat([
          '# 3. the runner needs the Anthropic SDK and a key',
          'python3 -m venv .venv',
          './.venv/bin/pip install anthropic',
          'export ANTHROPIC_API_KEY=sk-ant-...',
          '',
          '# 4. extract - reads ' + repo.name + '/, writes out/' + repo.name + '/',
          './.venv/bin/python acdl/acdl-agent/acdl-agent.py \\',
          '  --target ' + repo.name + ' \\',
          '  -o out/' + repo.name + ' \\',
          '  --effort high',
          '',
          '# --dry-run prints the assembled prompt without spending anything'
        ]).join('\n');
      }

      function workflowYaml(repo) {
        return document
          .getElementById('ghaTemplate')
          .textContent.replace('__TARGET__', repo.slug)
          .trim() + '\n';
      }

      var ICON_NEW =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
        '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>' +
        '<polyline points="14 2 14 8 20 8"></polyline>' +
        '<line x1="12" y1="18" x2="12" y2="12"></line>' +
        '<line x1="9" y1="15" x2="15" y2="15"></line></svg>';
      var ICON_KEY =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
        '<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777z' +
        'm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>';
      var ICON_DOWN =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
        '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>' +
        '<polyline points="7 10 12 15 17 10"></polyline>' +
        '<line x1="12" y1="15" x2="12" y2="3"></line></svg>';

      function link(href, icon, label) {
        var a = document.createElement('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML = icon + '<span></span>';
        a.lastChild.textContent = label;
        return a;
      }

      function renderGhaActions(repo, yaml) {
        var box = document.getElementById('ghaActions');
        box.innerHTML = '';

        var stale = box.parentNode.querySelector('.gha-fallback');
        if (stale) stale.remove();

        if (repo.isGitHub) {
          var base = 'https://github.com/' + repo.owner + '/' + repo.name;
          // GitHub's new-file editor prefills from the query string, so this
          // lands the visitor on a ready-to-commit workflow file.
          var newFile =
            base + '/new/' + (repo.ref || 'main') +
            '?filename=' + encodeURIComponent(WORKFLOW_PATH) +
            '&value=' + encodeURIComponent(yaml);

          box.appendChild(link(newFile, ICON_NEW, 'Commit this workflow to ' + repo.name));
          box.appendChild(link(
            base + '/settings/secrets/actions/new',
            ICON_KEY,
            'Add the ANTHROPIC_API_KEY secret'
          ));
        } else {
          var note = document.createElement('p');
          note.className = 'gha-fallback';
          note.textContent =
            repo.host + ' is not GitHub, so there is nothing to link to - commit the ' +
            'workflow yourself, or use one of the local commands above.';
          box.parentNode.insertBefore(note, box);
        }

        var dl = document.createElement('button');
        dl.type = 'button';
        dl.innerHTML = ICON_DOWN + '<span>Download acdl-extract.yml</span>';
        dl.addEventListener('click', function () {
          var blob = new Blob([yaml], { type: 'text/yaml' });
          var href = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = href;
          a.download = 'acdl-extract.yml';
          a.click();
          setTimeout(function () { URL.revokeObjectURL(href); }, 1000);
        });
        box.appendChild(dl);
      }

      function generate(raw) {
        var repo = parseRepo(raw);
        if (!repo) {
          errorEl.textContent =
            'That does not look like a git repository. Try https://github.com/owner/repo, ' +
            'git@github.com:owner/repo.git, or owner/repo.';
          errorEl.hidden = false;
          result.hidden = true;
          return;
        }

        errorEl.hidden = true;
        document.getElementById('resultRepo').textContent =
          repo.slug + (repo.ref ? ' @ ' + repo.ref : '');
        document.getElementById('code-cc').textContent = claudeCodeScript(repo);
        document.getElementById('code-api').textContent = apiScript(repo);

        var yaml = workflowYaml(repo);
        document.getElementById('code-gha').textContent = yaml;
        renderGhaActions(repo, yaml);

        result.hidden = false;

        // Shareable: extract.html?repo=owner/name reopens the same commands.
        var url = new URL(window.location.href);
        url.searchParams.set('repo', repo.slug);
        history.replaceState(null, '', url);

        if (result.scrollIntoView) {
          result.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        generate(input.value);
      });

      Array.prototype.forEach.call(document.querySelectorAll('.example-chip'), function (chip) {
        chip.addEventListener('click', function () {
          input.value = chip.dataset.url;
          generate(chip.dataset.url);
        });
      });

      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
        tab.addEventListener('click', function () {
          Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
            t.classList.toggle('is-active', t === tab);
          });
          Array.prototype.forEach.call(document.querySelectorAll('.tab-panel'), function (p) {
            p.classList.toggle('is-active', p.id === 'panel-' + tab.dataset.tab);
          });
        });
      });

      Array.prototype.forEach.call(document.querySelectorAll('.copy-btn'), function (btn) {
        btn.addEventListener('click', function () {
          var text = document.getElementById(btn.dataset.copy).textContent;
          navigator.clipboard.writeText(text).then(function () {
            btn.classList.add('copied');
            btn.textContent = 'Copied!';
            setTimeout(function () {
              btn.classList.remove('copied');
              btn.textContent = 'Copy';
            }, 1800);
          });
        });
      });

      var preset = new URLSearchParams(window.location.search).get('repo');
      if (preset) {
        input.value = preset;
        generate(preset);
      }
    })();
  </script>
</body>
</html>
