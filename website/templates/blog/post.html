<!DOCTYPE html>
<!-- Shell for every blog page. Filled in by scripts/build-blog.js from blog/*.md. -->
<html lang="en">
<head>
  {{GA}}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{BASE}}shared/styles.css">
  <link rel="stylesheet" href="{{BASE}}shared/blog.css">
</head>
<body>
  {{NAV}}

  <div class="blog-layout">
    <aside class="blog-ledger" id="blog-ledger">
      <button type="button" class="ledger-toggle" aria-expanded="false" aria-controls="ledger-list">All posts</button>
      <!-- Not a <nav>: styles.css pins every <nav> to the top of the page. -->
      <div class="ledger-posts" role="navigation" aria-label="Blog posts">
        <a class="ledger-heading" href="index.html">Blog</a>
        <ol id="ledger-list">
          {{LEDGER}}
        </ol>
      </div>
    </aside>

    <main class="blog-main">
      <article class="blog-post">
        <header class="blog-post-header">
          <h1>{{HEADING}}</h1>
          <p class="blog-post-date">{{DATE}}</p>
        </header>
        {{CONTENT}}
      </article>

      <!-- COMMENTS:START -->
      <section id="comments" class="comments" data-post="{{POST}}">
        <h2 id="comments-heading">Comments</h2>
        <p class="comments-notice" id="comments-notice" role="status" hidden></p>
        <div id="comments-list" class="comments-list">
          <p class="comments-empty">Loading comments&hellip;</p>
        </div>

        <form id="comment-form" class="comment-form">
          <h3>Add a comment</h3>
          <label>Name
            <input type="text" name="name" required maxlength="80" autocomplete="name">
          </label>
          <label>Comment title
            <input type="text" name="title" required maxlength="150">
          </label>
          <label>Comment
            <textarea name="text" required maxlength="5000" rows="6"></textarea>
          </label>
          <!-- Left empty by people; filled in by spam bots. -->
          <div class="comment-form-extra" aria-hidden="true">
            <label>Website
              <input type="text" name="website" tabindex="-1" autocomplete="off">
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="blog-btn">Publish comment</button>
            <span class="form-status" role="status"></span>
          </div>
        </form>

        <form id="subscribe-form" class="subscribe-form">
          <h3>Subscribe to this comment section</h3>
          <p>Get an email when a new comment is added to this post.</p>
          <div class="subscribe-row">
            <input type="email" name="email" required maxlength="254" placeholder="you@example.com" aria-label="Email address" autocomplete="email">
            <button type="submit" class="blog-btn blog-btn-secondary">Subscribe</button>
          </div>
          <span class="form-status" role="status"></span>
        </form>
      </section>
      <!-- COMMENTS:END -->
    </main>
  </div>

  {{FOOTER}}
  <script src="{{BASE}}shared/blog.js" defer></script>
</body>
</html>
